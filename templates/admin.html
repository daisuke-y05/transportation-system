<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理画面</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>📋 {{ app_name }} {{ app_version }} 管理画面</h1>
    <form method="GET" action="/admin">

    <div class="grid">

        <div>

            <label>対象月</label>

            <select name="month">

                <option value="">すべて表示</option>

                {% for m in months %}

                <option value="{{ m.value }}"
                    {% if month == m.value %}selected{% endif %}>

                    {{ m.label }}

                </option>

                {% endfor %}

            </select>

        </div>

    </div>

    <br>

    <button type="submit" class="add">
        表示
    </button>

</form>

<br>

    {% if rows %}

    <table class="adminTable">

        <thead>

           <tr>
    <th>氏名</th>
    <th>対象月</th>
    <th>提出日時</th>
    <th>状態</th>
    <th>詳細</th>
</tr>

        </thead>

        <tbody>

        {% for row in rows %}

            <tr>

                <td>{{ row.name }}</td>

                <td>{{ row.month }}</td>

                <td>{{ row.submitted_at }}</td>

                <td>

    {% if row.edited_after_submit %}

        <span class="statusEdit">
            ⚠️ 提出後に編集あり
        </span>

    {% else %}

        <span class="statusOK">
            ✅ 提出済み
        </span>

    {% endif %}

</td>


                <td>

    <a href="/detail/{{ row.name }}/{{ row.month }}"
       class="editButton">

        📄 詳細

    </a>

</td>

            </tr>

        {% endfor %}

        </tbody>

    </table>

    {% else %}

        <div class="empty">
            提出されたデータはありません。
        </div>

    {% endif %}

    <br>

    <a href="/" class="add">
        スタッフ画面へ戻る
    </a>

</div>

</body>

</html>
